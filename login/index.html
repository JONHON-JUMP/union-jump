<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JUMP - Jonhon Uniform Manufacturing Platform | 中航光电统一制造平台">
    <title>JUMP — 中航光电统一制造平台</title>

    <!-- Google Fonts: 科技感字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">

        <!-- ========== 左侧品牌视觉区 ========== -->
        <div class="brand-section">
            <!-- 粒子连接器动效画布 -->
            <canvas id="particle-canvas"></canvas>

            <!-- 品牌信息覆盖层 -->
            <div class="brand-overlay">
                <!-- JUMP 系统名称 -->
                <div class="system-badge">
                    <div class="badge-glow"></div>
                    <h2 class="system-name">JUMP</h2>
                    <p class="system-fullname">Jonhon Uniform Manufacturing Platform</p>
                    <p class="system-cn">JONHON统一制造管理平台</p>
                </div>

                <!-- Slogan -->
                <div class="slogan">
                    <span class="slogan-icon">⚡</span>
                    <p class="slogan-text">连接世界，制造未来</p>
                </div>
            </div>
        </div>

        <!-- ========== 右侧登录表单区 ========== -->
        <div class="form-section">
            <div class="form-wrapper">
                <!-- 顶部 Logo 区域 -->
                <div class="form-header">
                    <p class="form-welcome">欢迎登录</p>
                </div>

                <!-- 登录表单 -->
                <form id="login-form" autocomplete="off">
                    <!-- 用户名 -->
                    <div class="input-group">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                        <input type="text" id="username" name="username" placeholder=" " required>
                        <label for="username">用户名 / 工号</label>
                        <div class="input-highlight"></div>
                    </div>

                    <!-- 密码 -->
                    <div class="input-group">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </div>
                        <input type="password" id="password" name="password" placeholder=" " required>
                        <label for="password">密码</label>
                        <div class="input-highlight"></div>
                        <button type="button" class="toggle-password" id="toggle-password" aria-label="显示/隐藏密码">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>

                    <!-- 记住我 -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember" name="remember">
                            <span class="checkmark"></span>
                            <span class="remember-text">记住我</span>
                        </label>
                    </div>

                    <!-- 登录按钮 -->
                    <button type="submit" class="login-btn" id="login-btn">
                        <span class="btn-text">登 录</span>
                        <span class="btn-loader" style="display:none;">
                            <span class="loader-dot"></span>
                            <span class="loader-dot"></span>
                            <span class="loader-dot"></span>
                        </span>
                        <div class="btn-glow"></div>
                    </button>
                </form>

                <!-- 底部版权信息 -->
                <div class="form-footer">
                    <p class="copyright">© 中航光电科技股份有限公司</p>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
