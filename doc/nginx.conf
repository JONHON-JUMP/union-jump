worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    log_format upstream '$remote_addr - "$request" $status upstream=$upstream_addr resp=$upstream_response_time';
    access_log logs/access.log upstream;   # ??????

    gzip on;
    gzip_min_length 1k;     # ?????????????????????????
    gzip_buffers 4 16k;     # ??????? gzip ????????
    gzip_http_version 1.1;  # ??? HTTP ??????
    gzip_comp_level 2;      # ???? gzip ??????? 1-9??1 ???????????????? 9 ??
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript; # ??????????
    gzip_proxied any;       # ????????????? headers ???????????????????????????

    server {
        listen       9000;
        server_name  localhost; ## ???????????????????? IP/????

        location / { ## ??????
            root   D:\software\cabinet\dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /admin-api/ { ## ?????? - ???????
            proxy_pass http://localhost:48080/; ## ?????????proxy_pass ????????????????????????? IP
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

    }

  server {
        client_max_body_size 100M;
        listen       8088;
        server_name  localhost;
        charset utf-8;

        location / {
            root   D:/software/jump/jump;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /admin-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://192.168.240.129:12345/admin-api/;
        } 
    }

